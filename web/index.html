<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Knots - plan your wedding together: budget, expenses, guests, gifts and more.">
  <meta name="theme-color" content="#26323A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Knots">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Knots</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body{margin:0;height:100%;background:#FAF6F0}
    @media (prefers-color-scheme:dark){html,body{background:#171518}#splash{color:#F2EBE0}}
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:700 30px Roboto,system-ui,sans-serif;color:#221E27;transition:opacity .25s}
    #splash .r{display:flex}
    #splash .r i{width:34px;height:34px;border-radius:50%;border:3.5px solid #4C7FB8;box-sizing:border-box;animation:p 1.2s ease-in-out infinite}
    #splash .r i+i{border-color:#D19A3F;margin-left:-10px;animation-delay:.2s}
    @keyframes p{50%{transform:scale(.88)}}
  </style>
</head>
<body>
  <div id="splash"><div class="r"><i></i><i></i></div>Knots</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = 0; setTimeout(function () { s.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
